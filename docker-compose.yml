services:
  frontend:
    build:
      context: ./HARSHALADOBE
      dockerfile: Dockerfile
    ports:
      - "3000:5173"
    environment:
      - VITE_ADOBEV4_URL=http://localhost:8082
    volumes:
      - ./HARSHALADOBE:/app
      - /app/node_modules
    depends_on:
      adobev4-backend:
        condition: service_healthy
    networks:
      - adobe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  adobev4-backend:
    build:
      context: ./adobev4
      dockerfile: Dockerfile
    ports:
      - "8082:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - AZURE_SPEECH_KEY=${AZURE_SPEECH_KEY}
      - AZURE_SPEECH_REGION=${AZURE_SPEECH_REGION}
      - TTS_PROVIDER=azure
      - HOST=0.0.0.0
      - PORT=8080
      - DEBUG=true
      - DEVELOPMENT_MODE=true
      - VERBOSE_LOGGING=false
    volumes:
      - ./adobev4/audio:/app/adobev4-backend/audio
      - ./adobev4/documents:/app/adobev4-backend/documents
      - ./adobev4/index:/app/adobev4-backend/index
    networks:
      - adobe-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

networks:
  adobe-network:
    driver: bridge

volumes:
  adobe-audio:
  adobe-documents:
  adobe-index: